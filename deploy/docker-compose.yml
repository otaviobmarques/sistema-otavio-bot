# Otávio Bot on one server: the harness server plus Caddy for TLS + login.
# Step by step, in Portuguese, for the owner's VPS: docs/otavio-bot/VPS-24H.md.
#
# Caddy runs in the server's network namespace, so it reaches the server on
# 127.0.0.1 — the server never binds a public interface. Ports are therefore
# declared on the `omb` service (the namespace owner).
#
#   cp .env.example .env   # set DOMAIN
#   docker compose pull omb && docker compose up -d     # prebuilt image
#   docker compose up -d --build                        # or build from source
#
# Behind a proxy that already holds ports 80/443, add
# docker-compose.atras-de-proxy.yml (COMPOSE_FILE in .env.example).
name: ${COMPOSE_PROJECT_NAME:-otavio-bot}

services:
  omb:
    build:
      context: ..
      args:
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex}
    # Published by .github/workflows/docker.yml: `latest` and the version on
    # every "Publicar versão", `main` on every push to main.
    image: ghcr.io/otaviobmarques/sistema-otavio-bot:${OTAVIO_BOT_VERSION:-latest}
    restart: always
    # The bots' browsers (docs/browser-packaging.md, "Process hygiene"): an
    # init collects the browser processes whose parents exit, and Chrome
    # gets the shared memory OMB's desktop containers give it.
    init: true
    shm_size: 512m
    # The server, its engines and the bots' browsers. Each bot's own desktop
    # is a separate container on the host with its own 4 GB cap.
    mem_limit: ${OTAVIO_MEM_LIMIT:-3g}
    # The bots' VPS desktops: the server reaches this machine's Docker over
    # SSH to the host (deploy/ligar-desktops.sh).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/data
    ports:
      - "80:80"
      - "443:443"
    environment:
      OMB_PORT: "8799"
      OMB_WEBHOOK_PORT: "8800"
      # what the app prints as hook URLs — Caddy passes /hooks/* straight through
      OMB_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
      # pairing links for remote clients point here (docs/self-hosting.md)
      OMB_PUBLIC_URL: https://${DOMAIN}
      OMB_SERVER_NAME: ${OMB_SERVER_NAME:-${DOMAIN}}
      # Who may sign in with an emailed code at /pair (docs/self-hosting.md,
      # "Sign in with your email"). Empty means pairing codes only.
      OMB_SIGNIN_EMAILS: ${OMB_SIGNIN_EMAILS:-}
      OMB_SIGNIN_MEMBER_EMAILS: ${OMB_SIGNIN_MEMBER_EMAILS:-}
      # Send the codes through your own mail server (same section of the docs).
      OMB_SIGNIN_SMTP_URL: ${OMB_SIGNIN_SMTP_URL:-}
      OMB_SIGNIN_SMTP_FROM: ${OMB_SIGNIN_SMTP_FROM:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8799/api/health | grep -q openmausbot"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2.10.2
    restart: always
    network_mode: "service:omb"
    mem_limit: 256m
    depends_on:
      omb:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
